spring:
  application:
    name: taskify
  datasource:
    hikari:
      pool-name: taskify-pool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
    cache-names:
      - taskLists
      - tasks
    caffeine:
      spec: maximumSize=500,expireAfterAccess=10m

logging:
  structured:
    format:
      console: ecs
